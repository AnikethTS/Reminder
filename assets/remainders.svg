<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Bell ears -->
  <line x1="15" y1="15" x2="10" y2="9"  stroke="#3584e4" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="33" y1="15" x2="38" y2="9"  stroke="#3584e4" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Outer circle (shadow / border) -->
  <circle cx="24" cy="28" r="17" fill="#1c5bbf"/>
  <!-- Clock face fill -->
  <circle cx="24" cy="28" r="17" fill="#3584e4"/>
  <!-- White inner face -->
  <circle cx="24" cy="28" r="13.5" fill="white"/>
  <!-- Hour hand -->
  <line x1="24" y1="28" x2="24" y2="18"  stroke="#3584e4" stroke-width="3"   stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="24" y1="28" x2="33" y2="28"  stroke="#3584e4" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Centre dot -->
  <circle cx="24" cy="28" r="2.2" fill="#3584e4"/>
</svg>
